services:
  admin-page:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    image: admin-page:latest
    container_name: admin-page
    ports:
      - "5174:80"
    restart: unless-stopped
    networks:
      - calocounter-net

networks:
  calocounter-net:
    external: true
